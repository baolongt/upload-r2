<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · R2 Large File Transfer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <!-- Styles are inline so the login page needs nothing else served to it. -->
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --line: #262d3a;
        --text: #e6edf3;
        --muted: #8b98a9;
        --accent: #f6821f;
        --err: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(1200px 600px at 50% -200px, #1b2331, var(--bg));
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
        text-align: center;
      }
      .logo { font-size: 34px; }
      h1 { font-size: 18px; margin: 10px 0 4px; }
      p.muted { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
      form { display: grid; gap: 10px; }
      input {
        background: #1c2230;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        width: 100%;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button {
        background: var(--accent);
        color: #1a1200;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .error { color: var(--err); font-size: 13px; min-height: 19px; margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">📦</div>
      <h1>R2 Large File Transfer</h1>
      <p class="muted">Enter the password to continue</p>
      <form id="form">
        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          autofocus
          required
        />
        <button type="submit" id="submit">Sign in</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </div>

    <script type="module">
      const form = document.getElementById('form');
      const password = document.getElementById('password');
      const submit = document.getElementById('submit');
      const error = document.getElementById('error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        submit.disabled = true;
        submit.textContent = 'Signing in…';
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: password.value }),
          });
          if (response.ok) {
            location.href = '/';
            return;
          }
          const payload = await response.json().catch(() => ({}));
          error.textContent = payload.error || 'Could not sign in';
          password.select();
        } catch {
          error.textContent = 'Network error — is the server running?';
        } finally {
          submit.disabled = false;
          submit.textContent = 'Sign in';
        }
      });
    </script>
  </body>
</html>
